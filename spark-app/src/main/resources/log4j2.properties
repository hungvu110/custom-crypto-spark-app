# log4j2 config cho sample-spark-application-privacy.
#
# Muc tieu: kubectl logs chi con lai phan quan trong cua app (banner/section/kv
# cua Log.scala, logger "VLP") va cac tin hieu bao mat HDFS can trace, thay vi
# ngap trong log noi bo cua Spark/Hadoop/Jetty/Netty.
#
# Hai logger SASL/Token duoc code (SparkApp.enableHdfsSaslDebug) tu nang len
# DEBUG luc chay de phuc vu buoc verify o muc 14.2 cua plan; baseline o day
# giu WARN de khong lam nhieu khi khong can debug.

status = warn
name = SampleSparkApplicationPrivacyLog4j2

# --- Console appender ---
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# --- Root: mac dinh WARN, chan het chatter khong ten trong danh sach duoi ---
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

# --- Logger nghiep vu cua app (Log.scala dung logger name "VLP") ---
logger.vlp.name = VLP
logger.vlp.level = info
logger.vlp.additivity = false
logger.vlp.appenderRef.stdout.ref = console

# --- HDFS block token / SASL: quan trong cho viec trace loi wire encryption ---
logger.sasl.name = org.apache.hadoop.hdfs.protocol.datatransfer.sasl
logger.sasl.level = warn
logger.token.name = org.apache.hadoop.security.token.Token
logger.token.level = warn

# --- Tien do job worth-keeping o muc WARN (stage/task fail) ---
logger.sparksched.name = org.apache.spark.scheduler.TaskSetManager
logger.sparksched.level = warn
logger.sparkexec.name = org.apache.spark.executor.Executor
logger.sparkexec.level = warn

# --- Cham dut chatter noi bo, khong lien quan nghiep vu ---
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
logger.hadoopipc.name = org.apache.hadoop.ipc
logger.hadoopipc.level = error
logger.hadoopfs.name = org.apache.hadoop.fs
logger.hadoopfs.level = error
logger.hadoopsecurity.name = org.apache.hadoop.security
logger.hadoopsecurity.level = warn
logger.netty.name = io.netty
logger.netty.level = error
logger.shuffle.name = org.apache.spark.shuffle
logger.shuffle.level = error
logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen
logger.codegen.level = error

# --- Bo sung: chan het toan bo nhanh org.apache.spark/org.apache.hadoop bang
# 1 catch-all tuong minh (additivity=false), thay vi chi dua vao cac sub-logger
# le te o tren + fallback ngam vao root. Cac logger cu the hon (vlp/sasl/token/
# jetty/parquet/...) van thang vi Log4j2 uu tien logger khop chinh xac nhat. ---
logger.sparkall.name = org.apache.spark
logger.sparkall.level = warn
logger.sparkall.additivity = false
logger.sparkall.appenderRef.stdout.ref = console

logger.hadoopall.name = org.apache.hadoop
logger.hadoopall.level = warn
logger.hadoopall.additivity = false
logger.hadoopall.appenderRef.stdout.ref = console

# --- Delta Lake: tuong duong "org.apache.iceberg" o app khac dang dung Iceberg ---
logger.delta.name = io.delta
logger.delta.level = warn
logger.delta.additivity = false
logger.delta.appenderRef.stdout.ref = console

# --- Chan chatter scheduler K8s + fabric8 client (Spark Operator/K8s backend) ---
logger.sparkk8s.name = org.apache.spark.scheduler.cluster.k8s
logger.sparkk8s.level = error
logger.sparkk8s.additivity = false
logger.sparkk8s.appenderRef.stdout.ref = console

logger.fabric8.name = io.fabric8.kubernetes.client
logger.fabric8.level = error
logger.fabric8.additivity = false
logger.fabric8.appenderRef.stdout.ref = console
