# K8s Secret chứa keyPrefix của từng bảng: mỗi entry trong data là
# "<tên bảng>: <giá trị keyPrefix của bảng đó>". Khi mount làm volume, mỗi key
# thành 1 file <mountPath>/<tên bảng> có nội dung là keyPrefix
# (spark-application-column.yaml mount vào /etc/key-prefix -> /etc/key-prefix/sample_table).
#
# Tên key chỉ được dùng [A-Za-z0-9_.-] và không bắt đầu bằng "." (app từ chối tên khác).
# GIÁ TRỊ DƯỚI ĐÂY LÀ MẪU — thay bằng giá trị thật khi tạo Secret, KHÔNG commit giá trị thật vào Git.
apiVersion: v1
kind: Secret
metadata:
  name: key-prefix
  namespace: vlp-tenantw1xjixm-wsytjjtr0-ingestion
type: Opaque
stringData:
  sample_table: "sample_table_dev_prefix"
