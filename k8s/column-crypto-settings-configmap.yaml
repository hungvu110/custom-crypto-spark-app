# ConfigMap cấu hình mã hoá cột theo dataset/table — KHÔNG chứa bí mật, commit được vào Git.
#
# Mount vào driver/executor của SparkApplication tại /etc/app-config (xem k8s/spark-application.yaml,
# volume "crypto-settings"), env CRYPTO_CONFIG_PATH=/etc/app-config/column-crypto.yaml.
# keyPrefix KHÔNG nằm ở đây: lấy từ Vault (CRYPTO_PREFIX_SOURCE=vault) hoặc K8s Secret
# (k8s/key-prefix-secret.yaml).
#
# Apply TRƯỚC khi apply spark-application.yaml:
#   kubectl apply -f k8s/column-crypto-settings-configmap.yaml
# Thiếu ConfigMap thì driver fail ngay ở ColumnCryptoConfig.load() với lỗi
# "Column crypto config file not found".
#
# Chỉ đường DataFrame API (SparkApplication) dùng file này. SQL function
# column_encrypt/column_decrypt trên sql-engine không cần: keyField được truyền thẳng vào lời gọi.
apiVersion: v1
kind: ConfigMap
metadata:
  name: column-crypto-settings
  namespace: vlp-tenantw1xjixm-wsytjjtr0-ingestion
data:
  column-crypto.yaml: |
    datasets:
      sample_table:
        keyField: "created_at"   # cột KHÔNG bị mã hoá, dùng làm nguyên liệu key
        encryptedColumns:
          - "name"
          - "city"
