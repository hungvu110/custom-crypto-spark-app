# K8s Secret chứa khoá giả danh cho nguồn "file" (CRYPTO_PREFIX_SOURCE=file). Mount làm volume: mỗi key thành 1 file
# <mountPath>/<tên khoá>, đúng tên mà lib đọc (PrefixSourceKeyProvider):
#   pseudonym.hmac_v<N>      chế độ HASH    — 32 byte: echo "base64:$(openssl rand -base64 32)"
#   pseudonym.aes_siv_v<N>   chế độ ENCRYPT — 64 byte: echo "base64:$(openssl rand -base64 64 | tr -d '\n')"
# <N> là version khoá (mặc định 1; đổi bằng spark.pseudonym.hmac.version / spark.pseudonym.aes-siv.version).
# MAPPING không có khoá (bảng ánh xạ Delta lưu ở MAPPING_TABLE_PATH, phân quyền riêng).
#
# KHÔNG commit khoá thật vào Git và không dùng lại khoá giữa môi trường test/production. Tạo Secret thật bằng:
#   kubectl create secret generic pseudonym-keys -n <namespace> \
#     --from-literal=pseudonym.hmac_v1="base64:$(openssl rand -base64 32)" \
#     --from-literal=pseudonym.aes_siv_v1="base64:$(openssl rand -base64 64 | tr -d '\n')"
# QUAN TRỌNG: dữ liệu đã giả danh bằng khoá nào chỉ tra/giải mã được bằng đúng khoá đó — MẤT khoá = mất khả năng tái
# định danh; ĐỔI khoá = mọi định danh giả đổi (đứt liên kết với dữ liệu cũ). Sao lưu khoá ở nơi an toàn.
# Giá trị dưới đây là CHỖ TRỐNG — apply nguyên file này thì lib sẽ từ chối (không phải base64 hợp lệ).
apiVersion: v1
kind: Secret
metadata:
  name: pseudonym-keys
  namespace: vlp-tenantw1xjixm-wsbmkimit-teamk6gy0b5
type: Opaque
stringData:
  pseudonym.hmac_v1: "base64:<32 byte ngẫu nhiên>"
  pseudonym.aes_siv_v1: "base64:<64 byte ngẫu nhiên>"
