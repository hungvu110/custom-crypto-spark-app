# log4j2 config cho pseudonymize-table-app (cùng cách làm với hdfs-load-stress-test/src/main/resources/log4j2.properties).
#
# kubectl logs chỉ còn phần của app (banner/section/kv/bảng check của Log.scala, logger "VLP") thay vì log nội bộ
# Spark/Hadoop/Delta. Trên K8s, /opt/spark/conf bị ConfigMap của Spark mount đè nên file này được COPY vào /opt/app và
# trỏ tới bằng -Dlog4j.configurationFile (xem k8s/*.yaml).

status = warn
name = PseudonymizeTableLog4j2

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

# Logger nghiệp vụ của app: config, kết quả từng check, VERDICT.
logger.vlp.name = VLP
logger.vlp.level = info
logger.vlp.additivity = false
logger.vlp.appenderRef.stdout.ref = console

# Gia hạn delegation token Kerberos: giữ INFO.
logger.tokenrenew.name = org.apache.spark.deploy.security
logger.tokenrenew.level = info
logger.tokenrenew.additivity = false
logger.tokenrenew.appenderRef.stdout.ref = console

logger.sparkall.name = org.apache.spark
logger.sparkall.level = warn
logger.hadoopall.name = org.apache.hadoop
logger.hadoopall.level = warn
logger.delta.name = org.apache.spark.sql.delta
logger.delta.level = warn
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
logger.netty.name = io.netty
logger.netty.level = error
logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen
logger.codegen.level = error
logger.sparkk8s.name = org.apache.spark.scheduler.cluster.k8s
logger.sparkk8s.level = error
logger.fabric8.name = io.fabric8.kubernetes.client
logger.fabric8.level = error

# Delta + Hive metastore: khi overwrite bảng Delta đã có, metastore từ chối đổi schema (cột giữ chỗ col array<string>) và
# Spark tự fallback sang lưu schema trong table properties, nhưng vẫn in WARN kèm cả stack trace ở mỗi lần chạy. Vô hại với
# Spark/Delta (xem pseudonymize-table-app/README.md mục 7); chỉ hạ mức log của đúng logger này, lỗi thật vẫn ở mức error.
logger.hivecatalog.name = org.apache.spark.sql.hive.HiveExternalCatalog
logger.hivecatalog.level = error
