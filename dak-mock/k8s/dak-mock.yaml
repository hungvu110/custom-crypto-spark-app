# dak-mock trên Kubernetes: ConfigMap (cấu hình không bí mật) + Deployment + Service.
# Namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy (cùng namespace với sql-engine và SparkApplication của team).
#
# Token Vault (NHẠY CẢM) KHÔNG nằm trong file này. Tạo Secret trước, cùng namespace:
#   read -rs -p "Vault token: " T; echo
#   kubectl create secret generic dak-mock-vault-token \
#     -n vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy --from-literal=token="$T"; unset T
#
# Token Vault này cần quyền read trên path key cả bảng VÀ read trên kv/data/hla-datalake/datalake/column-keys/* (key theo cột
# của GET /api/v1/keys/by-column). Thêm quyền create trên path đó nếu muốn mock tự tạo key khi fulfill YC (mock ghi bằng
# cas=0 nên không cần quyền update).
#
# KEY THEO CỘT — tạo tay trước (mỗi cột một secret, field keyPrefix), cột đã có secret thì by-column trả READY ngay:
#   vault kv put kv/hla-datalake/datalake/column-keys/<database>/<table>/<column> keyPrefix="$(openssl rand -base64 32)"
#   vd: vault kv put kv/hla-datalake/datalake/column-keys/demo_db/users_cdr/name keyPrefix="$(openssl rand -base64 32)"
# <database>, <table>, <column> viết CHỮ THƯỜNG, chỉ gồm a-z, 0-9, _. Không ghi đè secret đã có: key đã dùng để mã hoá
# thì đổi giá trị là mất khả năng giải mã dữ liệu cũ.
#
# Token của endpoint quản trị /mock-admin/** (tạo key cho YC, từ chối YC, khoá cột). Không tạo Secret = tắt endpoint:
#   kubectl create secret generic dak-mock-admin-token \
#     -n vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy --from-literal=token="$(openssl rand -hex 24)"
#
# FLOW PHIẾU KHỬ ĐỊNH DANH (docs/dak-deid-flow/): mặc định submitter=noop, không cần gì thêm. Để chạy thật (submitter=airflow):
#   1) kubectl apply -f dak-mock/k8s/dak-mock-deid-rbac.yaml     # ServiceAccount dak-mock + quyền secrets create/delete
#   2) Tài khoản portal giả (CÓ TOKEN, không commit file này): tạo từ file tạm
#        kubectl create secret generic dak-mock-portal-users -n vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy \
#          --from-file=application.yml=<file có dak.deid.portal-users>
#   3) User Airflow riêng cho DAK (Airflow 2.8 của bạn chỉ bật backend basic_auth và session, KHÔNG nhận Bearer Keycloak).
#      Tạo trong pod webserver (role User đủ quyền đọc DAG và tạo dag run; hoặc role riêng chỉ có hai quyền đó):
#        airflow users create --username dak-trigger --firstname DAK --lastname Mock --role User \
#          --email dak-trigger@example.invalid --password '<mật khẩu mạnh>'
#      rồi đưa mật khẩu cho mock:
#        kubectl create secret generic dak-mock-airflow -n vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy \
#          --from-literal=password='<mật khẩu mạnh>'
#   4) Sửa khối dak.deid trong ConfigMap bên dưới (submitter: airflow, airflow.base-url, username, allowed-dag-ids).
#
# CA nội bộ của Keycloak (PEM, có thể nhiều cert — root + intermediate), cùng namespace:
#   kubectl create configmap keycloak-ca -n vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy --from-file=ca.pem=<file CA>
#
# Rồi:  kubectl apply -f dak-mock/k8s/dak-mock.yaml
#
# Bên gọi trong cùng namespace dùng http://dak-mock:8085, namespace khác dùng
# http://dak-mock.vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy.svc.cluster.local:8085
# (mock chạy HTTP -> bên gọi phải đặt dak.allowInsecureHttp=true).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dak-mock-config
  namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy
  labels:
    app.kubernetes.io/name: dak-mock
data:
  # Ghi đè application.yml trong jar (nạp qua SPRING_CONFIG_ADDITIONAL_LOCATION). Danh sách realms/clients ở đây
  # THAY THẾ toàn bộ danh sách mặc định.
  application.yml: |
    dak:
      clock-skew: 60s
      realms:
        # Tenant hiện tại. issuer phải khớp CHÍNH XÁC claim iss của token — kiểm bằng
        # .well-known/openid-configuration của realm từ trong cluster (README mục 4.1).
        - realm: vlp-tenantw1xjixm
          tenant: vlp-tenantw1xjixm
          issuer: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm
          jwks-uri: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm/protocol/openid-connect/certs
      clients:
        # Team teamtscauiy, workspace wsw7vtwvi (theo namespace vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy).
        # GIẢ ĐỊNH — thay client-id bằng client vận hành tạo cho team trong realm vlp-tenantw1xjixm
        # (docs/key-access/DAK_API_SPEC.md mục 2.3). Thêm 1 phần tử cho mỗi client.
        - realm: vlp-tenantw1xjixm
          client-id: <client-id-cua-team>
          workspace: wsw7vtwvi
          team: teamtscauiy
        # Client nội bộ của GET /api/v1/keys/by-column (gửi tag=internal, không cần grant). GIẢ ĐỊNH — thay bằng
        # client client_credentials tạo riêng cho luồng này. Không thuộc team nào nên không gọi được /{database}/{table}.
        - realm: vlp-tenantw1xjixm
          client-id: <client-id-noi-bo>
          kind: internal
      # Grant theo cột cho client team (by-column không gửi tag). Thiếu grant trên MỘT cột là 403 cả lô.
      grants: []
      #  - team: teamtscauiy
      #    database: demo_db
      #    table: users_cdr
      #    columns: [name, city]
      #    expires-at: 2027-10-22T00:00:00Z
      vault:
        addr: http://vault.cyberspace.vn
        kv-mount: kv
        path-template: hla-datalake/datalake/spark-application/{database}.{table}
        # Key theo cột: mỗi cột một secret (field keyPrefix) dưới hla-datalake/datalake/. Tạo tay hoặc để mock tạo khi fulfill YC.
        column-path-template: hla-datalake/datalake/column-keys/{database}/{table}/{column}
        key-field: keyPrefix
      yc:
        max-open-per-table: 50
        auto-fulfill: false
      # Flow phiếu khử định danh (PYC). noop = không đọc Vault, không tạo Secret, không gọi Airflow (chỉ log).
      deid:
        enabled: true
        allowed-modes: [HASH]
        submitter: noop # đổi thành airflow khi đã làm các bước ở đầu file
        kubernetes:
          # Namespace tạo Secret key; PHẢI là namespace nơi DAG tạo SparkApplication (Pod chỉ mount được Secret cùng namespace).
          namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy
        airflow:
          # GIẢ ĐỊNH — thay bằng địa chỉ và cấu hình thật của Airflow 2.8 (REST /api/v1) và client Keycloak.
          base-url: http://airflow-webserver.vlp-tenantw1xjixm-wsw7vtwvi-data.svc.cluster.local:8080
          allowed-dag-ids: [deid_pseudonymize_table]
          # basic = HTTP Basic với user Airflow (mật khẩu ở env AIRFLOW_PASSWORD). client-credentials chỉ dùng được khi Airflow
          # đã bật backend nhận Bearer token Keycloak (hiện chưa), khi đó đặt token-url, client-id, scope và AIRFLOW_CLIENT_SECRET.
          auth: basic
          username: dak-trigger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dak-mock
  namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy
  labels:
    app.kubernetes.io/name: dak-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dak-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dak-mock
      annotations:
        # Đổi giá trị này (hoặc dùng kubectl rollout restart) để pod nạp lại ConfigMap sau khi sửa.
        dak-mock/config-version: "3"
    spec:
      # Cần token của ServiceAccount để tạo/xoá Secret key của phiếu khử định danh (submitter=airflow); với noop vô hại.
      serviceAccountName: dak-mock
      automountServiceAccountToken: true
      # Keycloak nội bộ: ghim IP cho chắc, không phụ thuộc DNS của cluster.
      hostAliases:
        - ip: "10.221.148.42"
          hostnames:
            - sso-lakehouse.cyberspace.vn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Cert của sso-lakehouse do CA nội bộ cấp: dựng truststore = cacerts của JDK (vẫn tin CA công khai)
        # + mọi cert trong ConfigMap keycloak-ca (key ca.pem, có thể chứa nhiều cert). Ghi ra emptyDir.
        - name: build-truststore
          image: hub.vtcc.vn:8989/dak-mock:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ec"]
          args:
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /opt/truststore/truststore.p12
              awk '/BEGIN CERTIFICATE/ { n++ } n > 0 { print > ("/opt/truststore/ca-" n ".pem") }' /ca/ca.pem
              ls /opt/truststore/ca-*.pem > /dev/null   # ca.pem không có cert nào -> init lỗi, pod không chạy
              for f in /opt/truststore/ca-*.pem; do
                keytool -importcert -noprompt -alias "internal-$(basename "$f" .pem)" -file "$f" \
                  -keystore /opt/truststore/truststore.p12 -storetype PKCS12 -storepass changeit
              done
              rm -f /opt/truststore/ca-*.pem
          env:
            - name: JAVA_TOOL_OPTIONS
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: keycloak-ca
              mountPath: /ca
              readOnly: true
            - name: truststore
              mountPath: /opt/truststore
      containers:
        - name: dak-mock
          # GIẢ ĐỊNH — theo convention registry hiện có; build bằng dak-mock/Dockerfile.
          image: hub.vtcc.vn:8989/dak-mock:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              # /portal là Secret dak-mock-portal-users (tuỳ chọn): không có thì bỏ qua.
              value: "file:/config/,optional:file:/portal/"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dak-mock-vault-token
                  key: token
            # Không có Secret -> biến rỗng -> endpoint quản trị tắt (404).
            - name: MOCK_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dak-mock-admin-token
                  key: token
                  optional: true
            # Mật khẩu user Airflow cho DAK (auth=basic). Không có Secret -> rỗng (chỉ cần khi submitter=airflow).
            - name: AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dak-mock-airflow
                  key: password
                  optional: true
            # Client secret của client Keycloak (chỉ khi auth=client-credentials).
            - name: AIRFLOW_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dak-mock-airflow
                  key: clientSecret
                  optional: true
            # Tin CA nội bộ của sso-lakehouse qua truststore do initContainer dựng.
            # Biến này THAY THẾ JAVA_TOOL_OPTIONS của image nên phải giữ lại các cờ cũ.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
                -Djavax.net.ssl.trustStore=/opt/truststore/truststore.p12
                -Djavax.net.ssl.trustStoreType=PKCS12
                -Djavax.net.ssl.trustStorePassword=changeit
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            # Root filesystem chỉ đọc; Tomcat/JVM ghi file tạm vào /tmp (emptyDir bên dưới).
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: truststore
              mountPath: /opt/truststore
              readOnly: true
            - name: portal-users
              mountPath: /portal
              readOnly: true
          # Mock không có endpoint health riêng: kiểm tra cổng HTTP đã mở.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: dak-mock-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # CA nội bộ (PEM). Tạo trước: kubectl create configmap keycloak-ca --from-file=ca.pem=<file CA> (README mục 8).
        - name: keycloak-ca
          configMap:
            name: keycloak-ca
        - name: truststore
          emptyDir:
            sizeLimit: 16Mi
        # Tài khoản portal giả (có token). Không tạo Secret -> thư mục rỗng -> portal tắt (404).
        - name: portal-users
          secret:
            secretName: dak-mock-portal-users
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: dak-mock
  namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy
  labels:
    app.kubernetes.io/name: dak-mock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dak-mock
  ports:
    - name: http
      port: 8085
      targetPort: http
