# dak-mock trên Kubernetes: ConfigMap (cấu hình không bí mật) + Deployment + Service.
#
# Token Vault (NHẠY CẢM) KHÔNG nằm trong file này. Tạo Secret trước, cùng namespace:
#   read -rs -p "Vault token (chỉ đọc): " T; echo
#   kubectl create secret generic dak-mock-vault-token -n <namespace> --from-literal=token="$T"; unset T
#
# Rồi:  kubectl apply -n <namespace> -f dak-mock/k8s/dak-mock.yaml
#
# Bên gọi trong cùng namespace dùng http://dak-mock:8085, namespace khác dùng
# http://dak-mock.<namespace>.svc.cluster.local:8085 (mock chạy HTTP -> bên gọi phải đặt dak.allowInsecureHttp=true).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dak-mock-config
  labels:
    app.kubernetes.io/name: dak-mock
data:
  # Ghi đè application.yml trong jar (nạp qua SPRING_CONFIG_ADDITIONAL_LOCATION). Danh sách realms/clients ở đây
  # THAY THẾ toàn bộ danh sách mặc định. GIẢ ĐỊNH — thay bằng realm/client thật.
  application.yml: |
    dak:
      clock-skew: 60s
      realms:
        - realm: vlp
          tenant: vlp
          # Phải khớp CHÍNH XÁC claim iss của token (lấy từ .well-known/openid-configuration của realm).
          issuer: https://keycloak.example/realms/vlp
          # Pod phải gọi được địa chỉ này (tải JWKS để verify chữ ký).
          jwks-uri: https://keycloak.example/realms/vlp/protocol/openid-connect/certs
      clients:
        - realm: vlp
          client-id: sa-vlp-datalake-analytics
          workspace: analytics
          team: analytics
      vault:
        addr: http://vault.cyberspace.vn
        kv-mount: kv
        path-template: hla-datalake/datalake/spark-application/{database}.{table}
        key-field: keyPrefix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dak-mock
  labels:
    app.kubernetes.io/name: dak-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dak-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dak-mock
      annotations:
        # Đổi giá trị này (hoặc dùng kubectl rollout restart) để pod nạp lại ConfigMap sau khi sửa.
        dak-mock/config-version: "1"
    spec:
      # Mock không gọi Kubernetes API: không cần mount token của ServiceAccount.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dak-mock
          # GIẢ ĐỊNH — theo convention registry hiện có; build bằng dak-mock/Dockerfile.
          image: hub.vtcc.vn:8989/dak-mock:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dak-mock-vault-token
                  key: token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            # Root filesystem chỉ đọc; Tomcat/JVM ghi file tạm vào /tmp (emptyDir bên dưới).
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Mock không có endpoint health riêng: kiểm tra cổng HTTP đã mở.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: dak-mock-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dak-mock
  labels:
    app.kubernetes.io/name: dak-mock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dak-mock
  ports:
    - name: http
      port: 8085
      targetPort: http
