server:
  port: ${PORT:8085}

spring:
  application:
    name: dak-mock
  servlet:
    multipart:
      # Lớp chặn ngoài cho upload phiếu khử định danh; giới hạn chính xác là dak.deid.max-upload-bytes (tối đa 1 MB).
      max-file-size: 1MB
      max-request-size: 2MB
      # Lớn hơn max-request-size: phần upload luôn nằm trong bộ nhớ, KHÔNG bao giờ ghi file tạm xuống đĩa.
      file-size-threshold: 4MB

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

dak:
  # Lệch đồng hồ cho phép khi kiểm tra exp/iat của token.
  clock-skew: 60s

  # Registry realm: mỗi tenant một realm. Chỉ token có iss khớp CHÍNH XÁC issuer dưới đây mới được tin.
  # Trên k8s, ConfigMap dak-mock-config (dak-mock/k8s/dak-mock.yaml) ghi đè toàn bộ phần này.
  realms:
    - realm: vlp-tenantw1xjixm
      tenant: vlp-tenantw1xjixm
      issuer: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm
      jwks-uri: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm/protocol/openid-connect/certs

  # Client Keycloak (do vận hành tạo theo docs/key-access/DAK_API_SPEC.md mục 2.3).
  # Client team: (realm, client-id) -> workspace, team. enabled: false để khoá client.
  # Client nội bộ của by-column: kind: internal, không cần workspace/team, ví dụ
  #   - realm: vlp-tenantw1xjixm
  #     client-id: <client-noi-bo>
  #     kind: internal
  clients:
    # GIẢ ĐỊNH — client-id của team teamtscauiy trong realm vlp-tenantw1xjixm, workspace wsw7vtwvi.
    - realm: vlp-tenantw1xjixm
      client-id: <client-id-cua-team>
      workspace: wsw7vtwvi
      team: teamtscauiy

  vault:
    addr: ${VAULT_ADDR:http://vault.cyberspace.vn}
    # Token Vault tĩnh, CHỈ đọc path key-prefix. Lấy từ biến môi trường, KHÔNG ghi vào file này.
    token: ${VAULT_TOKEN:}
    kv-mount: kv
    # Cùng path của luồng column/cdr crypto cũ, tên key hai phần <database>.<table> (chữ thường).
    # Có thể dùng thêm {tenant}, {workspace} nếu secret được tách theo namespace.
    path-template: hla-datalake/datalake/spark-application/{database}.{table}
    # Key theo cột của GET /api/v1/keys/by-column. Mỗi phần là MỘT đoạn đường dẫn riêng. Mock tạo key ở đây bằng
    # cas=0 (không bao giờ ghi đè) -> token Vault cần thêm quyền create trên path này.
    column-path-template: hla-datalake/datalake/column-keys/{database}/{table}/{column}
    key-field: keyPrefix

  # Grant theo cột cho client team (thay cho phiếu được duyệt của DAK). Client nội bộ (kind: internal) không cần grant.
  # Ví dụ:
  #   grants:
  #     - team: teamtscauiy
  #       database: demo_db
  #       table: users_cdr
  #       columns: [msisdn, imei]
  #       expires-at: 2027-10-22T00:00:00Z   # để trống = không hết hạn
  grants: []

  # YC của luồng nội bộ.
  yc:
    # Số YC OPEN tối đa cho mỗi (client, database, table); vượt thì MISSING + reason=yc_limit_reached.
    max-open-per-table: 50
    # true: onMissing=request tạo key ngay và trả READY (chỉ để chạy thử nhanh; DAK thật luôn mở YC).
    auto-fulfill: false

  # Endpoint quản trị /mock-admin/** (tạo key cho YC, từ chối, khoá cột). Để trống = tắt (trả 404).
  admin:
    token: ${MOCK_ADMIN_TOKEN:}

  # Flow phiếu yêu cầu khử định danh (PYC): docs/dak-deid-flow/. Mock đóng vai portal bằng HTTP (/mock-portal/**) và dùng
  # tài khoản giả. Bí mật KHÔNG nằm ở file này: tài khoản giả (portal-users, có token) khai trong Secret dak-mock-portal-users,
  # client secret/token của Airflow lấy từ biến môi trường.
  deid:
    enabled: true
    # Bản đầu chỉ HASH: ENCRYPT cần khoá 64 byte, MAPPING cần bảng ánh xạ, một key bảng không đủ.
    allowed-modes: [HASH]
    max-active-per-team: 20
    max-upload-bytes: 65536
    # Trống = cùng database nguồn. {seq} = số cuối của mã phiếu, {yyyyMMdd} = ngày duyệt.
    output-database: ""
    output-table-template: "{table}_deid_{yyyyMMdd}_{seq}"
    # noop (chỉ log manifest, không cần cluster) | kubernetes | airflow
    submitter: noop
    # Cần khi submitter=kubernetes hoặc airflow (cả hai tạo Secret key trong namespace này). Ví dụ:
    #   kubernetes:
    #     namespace: vlp-tenantw1xjixm-wsw7vtwvi-teamtscauiy
    #     template-file: /deid/sparkapplication.yaml   # chỉ cần khi submitter=kubernetes
    # Airflow 2.8, REST /api/v1. dagId người dùng chọn PHẢI nằm trong allowed-dag-ids. Ví dụ:
    #   airflow:
    #     base-url: http://airflow-webserver.airflow.svc.cluster.local:8080
    #     allowed-dag-ids: [deid_pseudonymize_table]
    #     auth: basic                         # basic (user Airflow) | client-credentials (cần Airflow nhận Bearer Keycloak) | bearer
    #     username: dak-trigger               # chỉ cho auth=basic; password qua env AIRFLOW_PASSWORD
    #     token-url: https://sso-lakehouse.cyberspace.vn/realms/<realm>/protocol/openid-connect/token
    #     client-id: <client-airflow>
    airflow:
      client-secret: ${AIRFLOW_CLIENT_SECRET:}
      token: ${AIRFLOW_TOKEN:}
      # auth=basic: user Airflow riêng cho DAK (Airflow 2.8 mặc định chỉ có backend basic_auth và session, KHÔNG nhận Bearer Keycloak)
      password: ${AIRFLOW_PASSWORD:}
