server:
  port: ${PORT:8085}

spring:
  application:
    name: dak-mock

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

dak:
  # Lệch đồng hồ cho phép khi kiểm tra exp/iat của token.
  clock-skew: 60s

  # Registry realm: mỗi tenant một realm. Chỉ token có iss khớp CHÍNH XÁC issuer dưới đây mới được tin.
  # Trên k8s, ConfigMap dak-mock-config (dak-mock/k8s/dak-mock.yaml) ghi đè toàn bộ phần này.
  realms:
    - realm: vlp-tenantw1xjixm
      tenant: vlp-tenantw1xjixm
      issuer: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm
      jwks-uri: https://sso-lakehouse.cyberspace.vn/realms/vlp-tenantw1xjixm/protocol/openid-connect/certs

  # Client Keycloak (do vận hành tạo theo docs/key-access/DAK_API_SPEC.md mục 2.3).
  # Client team: (realm, client-id) -> workspace, team. enabled: false để khoá client.
  # Client nội bộ của by-column: kind: internal, không cần workspace/team, ví dụ
  #   - realm: vlp-tenantw1xjixm
  #     client-id: <client-noi-bo>
  #     kind: internal
  clients:
    # GIẢ ĐỊNH — client-id của team teamtscauiy trong realm vlp-tenantw1xjixm, workspace wsw7vtwvi.
    - realm: vlp-tenantw1xjixm
      client-id: <client-id-cua-team>
      workspace: wsw7vtwvi
      team: teamtscauiy

  vault:
    addr: ${VAULT_ADDR:http://vault.cyberspace.vn}
    # Token Vault tĩnh, CHỈ đọc path key-prefix. Lấy từ biến môi trường, KHÔNG ghi vào file này.
    token: ${VAULT_TOKEN:}
    kv-mount: kv
    # Cùng path của luồng column/cdr crypto cũ, tên key hai phần <database>.<table> (chữ thường).
    # Có thể dùng thêm {tenant}, {workspace} nếu secret được tách theo namespace.
    path-template: hla-datalake/datalake/spark-application/{database}.{table}
    # Key theo cột của GET /api/v1/keys/by-column. Mỗi phần là MỘT đoạn đường dẫn riêng. Mock tạo key ở đây bằng
    # cas=0 (không bao giờ ghi đè) -> token Vault cần thêm quyền create trên path này.
    column-path-template: dak/column-keys/{database}/{table}/{column}
    key-field: keyPrefix

  # Grant theo cột cho client team (thay cho phiếu được duyệt của DAK). Client nội bộ (kind: internal) không cần grant.
  # Ví dụ:
  #   grants:
  #     - team: teamtscauiy
  #       database: demo_db
  #       table: users_cdr
  #       columns: [msisdn, imei]
  #       expires-at: 2027-10-22T00:00:00Z   # để trống = không hết hạn
  grants: []

  # YC của luồng nội bộ.
  yc:
    # Số YC OPEN tối đa cho mỗi (client, database, table); vượt thì MISSING + reason=yc_limit_reached.
    max-open-per-table: 50
    # true: onMissing=request tạo key ngay và trả READY (chỉ để chạy thử nhanh; DAK thật luôn mở YC).
    auto-fulfill: false

  # Endpoint quản trị /mock-admin/** (tạo key cho YC, từ chối, khoá cột). Để trống = tắt (trả 404).
  admin:
    token: ${MOCK_ADMIN_TOKEN:}
