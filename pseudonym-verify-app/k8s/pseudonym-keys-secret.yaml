# K8s Secret chứa khoá giả danh cho nguồn "file" (KEY_SOURCE=file / spark.pseudonym.source=file). Mount làm volume:
# mỗi key thành 1 file <mountPath>/<tên khoá>, đúng tên mà lib đọc (PrefixSourceKeyProvider):
#   pseudonym.hmac.v<N>      chế độ HASH    — 32 byte, sinh bằng: echo "base64:$(openssl rand -base64 32)"
#   pseudonym.aes-siv.v<N>   chế độ ENCRYPT — 64 byte, sinh bằng: echo "base64:$(openssl rand -base64 64 | tr -d '\n')"
# MAPPING không có khoá (bảng ánh xạ Delta lưu ở MAPPING_TABLE_PATH, phân quyền riêng).
#
# KHÔNG commit khoá thật vào Git và không dùng lại khoá giữa môi trường test/production. Tạo Secret thật bằng:
#   kubectl create secret generic pseudonym-keys -n <namespace> \
#     --from-literal=pseudonym.hmac.v1="base64:$(openssl rand -base64 32)" \
#     --from-literal=pseudonym.aes-siv.v1="base64:$(openssl rand -base64 64 | tr -d '\n')"
# Giá trị dưới đây là CHỖ TRỐNG — apply nguyên file này thì lib sẽ từ chối (không phải base64 hợp lệ).
apiVersion: v1
kind: Secret
metadata:
  name: pseudonym-keys
  namespace: vlp-tenantw1xjixm-wsbmkimit-teamk6gy0b5
type: Opaque
stringData:
  pseudonym.hmac.v1: "base64:<32 byte ngẫu nhiên>"
  pseudonym.aes-siv.v1: "base64:<64 byte ngẫu nhiên>"
