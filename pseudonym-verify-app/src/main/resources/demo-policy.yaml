# Policy giả danh cho dữ liệu tổng hợp của pseudonym-verify-app — KHÔNG chứa bí mật, commit được vào Git.
# Format: docs/PSEUDONYMIZATION_UDF_PLAN.md mục 4.2. App chạy policy này 1 lần cho MỖI chế độ trong PSEUDO_MODES
# (thay `mode` của mọi cột), nên `mode` ở đây chỉ là mặc định khi dùng policy với lib trực tiếp.
#
# Cột không có trong policy giữ nguyên. Cùng 1 cột định danh trên nhiều bảng phải cùng mode để join được.
tables:
  # Bảng nối 3 loại định danh.
  subscriber:
    customer_id: { mode: HASH, output: pseudonym_id }
    isdn:        { mode: HASH }
    imei:        { mode: HASH }
  # Phân tích hành trình khách hàng MyViettel: số thuê bao -> định danh giả.
  app_event:
    isdn: { mode: HASH }
  # Nghiên cứu hiệu quả trạm BTS: IMEI -> định danh giả.
  bts_connection:
    imei: { mode: HASH }
  # Viettel++: mã khách hàng -> pseudonym_id.
  loyalty_txn:
    customer_id: { mode: HASH, output: pseudonym_id }
